name: Build ByteBitShop

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Install Gradle 2.14.1
        run: |
          curl --fail --location --retry 3 --output /tmp/gradle.zip https://services.gradle.org/distributions/gradle-2.14.1-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp
      - name: Build
        run: /tmp/gradle-2.14.1/bin/gradle --no-daemon --stacktrace clean build
      - name: Verify JAR
        run: |
          JAR=build/libs/ByteBitShop-1.0.2.jar
          test -f "$JAR"
          unzip -t "$JAR"
          unzip -l "$JAR" | grep 'net/minedevhd/bytebitshop/ByteBitShopCore.class'
          sha256sum "$JAR"
      - name: Publish v1.0.2 release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=v1.0.2
          JAR=build/libs/ByteBitShop-1.0.2.jar
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "ByteBitShop 1.0.2" --notes "ByteBitShop 1.0.2: 2.5s Payment-Delay, kompakteres rot/schwarzes GUI und Rendering-/Clipping-Fixes."
          fi
          gh release upload "$TAG" "$JAR" --clobber
