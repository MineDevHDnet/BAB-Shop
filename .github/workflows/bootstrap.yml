name: Bootstrap BAB-Shop

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct and import ByteBitShop 1.0.2
        run: |
          cat .bootstrap/chunk*.b64 | tr -d '\n\r' | base64 -d > /tmp/BAB-Shop-1.0.2-source.tar.xz
          echo 'fd7c4043aa482092e2874b58891c881a3f15d8fe3fa942b3df9052dd7195f2ae  /tmp/BAB-Shop-1.0.2-source.tar.xz' | sha256sum -c -
          tar -xJf /tmp/BAB-Shop-1.0.2-source.tar.xz -C .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Import complete ByteBitShop 1.0.2 source'
          git push origin HEAD:main
