name: Bootstrap BAB-Shop

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  import:
    if: ${{ github.event.head_commit.message == 'Bootstrap full ByteBitShop 1.0.2 source' }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Import complete source tree
        run: |
          tar -xJf .bootstrap/source.tar.xz -C .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Import complete ByteBitShop 1.0.2 source'
          git push origin HEAD:main
